<!DOCTYPE html>
<html>
<head>
  <title>Monitoring Analisis Evaluasi Hukum</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/c/c3/Kemenkum.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    iframe {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      transition: opacity 0.3s ease;
    }
    #adminFrame { opacity: 0; pointer-events: none; z-index: 1; }
    #publicFrame { z-index: 2; }
  </style>
</head>
<body>
  <iframe id="adminFrame"
    src="https://script.google.com/macros/s/AKfycbzRNKQgE5b15f8LBajKzXcIRYBlIfIxUe6V3emKlUUdjqWjlxJvIbdgl0-0ZmDFGeck/exec?page=admin">
  </iframe>
  <iframe id="publicFrame"
    src="https://script.google.com/macros/s/AKfycbzRNKQgE5b15f8LBajKzXcIRYBlIfIxUe6V3emKlUUdjqWjlxJvIbdgl0-0ZmDFGeck/exec">
  </iframe>

  <script>
    // Fungsi dipanggil dari dalam GAS via parent.showAdmin()
    function showAdmin() {
      document.getElementById('publicFrame').style.opacity = '0';
      document.getElementById('publicFrame').style.pointerEvents = 'none';
      document.getElementById('publicFrame').style.zIndex = '1';

      document.getElementById('adminFrame').style.opacity = '1';
      document.getElementById('adminFrame').style.pointerEvents = 'all';
      document.getElementById('adminFrame').style.zIndex = '2';
    }

    function showPublic() {
      document.getElementById('adminFrame').style.opacity = '0';
      document.getElementById('adminFrame').style.pointerEvents = 'none';
      document.getElementById('adminFrame').style.zIndex = '1';

      document.getElementById('publicFrame').style.opacity = '1';
      document.getElementById('publicFrame').style.pointerEvents = 'all';
      document.getElementById('publicFrame').style.zIndex = '2';
    }
  </script>
</body>
</html>
